# DS: Ansible configuration. Do not edit, except the one line marked Part E.
[defaults]
inventory = inventory/hosts.ini
roles_path = ./roles
remote_user = azureuser
private_key_file = ~/.ssh/cao_lab
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
forks = 10
# Part E: once "make vault-pass" has created the file, remove the # below.
# vault_password_file = ~/.cao_ds_vault_pass

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o UserKnownHostsFile=/dev/null
